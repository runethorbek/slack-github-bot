name: CI

on:
  pull_request:
  workflow_dispatch:

# Read-only, no secrets, independent of the Slack workflows.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run JavaScript and TypeScript tests
        run: npm test
