name: Slack Message

on:
  repository_dispatch:
    types: [slack_message]

jobs:
  handle-message:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare Slack response URL
        run: |
          response_url="$(node -e 'const fs = require("fs"); const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(event.client_payload.response_url || "");')"
          echo "::add-mask::$response_url"
          echo "SLACK_RESPONSE_URL=$response_url" >> "$GITHUB_ENV"

      - name: Run Python bot
        env:
          SLACK_COMMAND: ${{ github.event.client_payload.command }}
          SLACK_TEXT: ${{ github.event.client_payload.text }}
          SLACK_CHANNEL_ID: ${{ github.event.client_payload.channel_id }}
          SLACK_THREAD_TS: ${{ github.event.client_payload.thread_ts }}
          SLACK_EVENT_TYPE: ${{ github.event.client_payload.slack_event_type }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TASKS_DATA_SOURCE_ID: ${{ secrets.NOTION_TASKS_DATA_SOURCE_ID }}
          TASKS_SLACK_CHANNEL_ID: ${{ secrets.TASKS_SLACK_CHANNEL_ID }}
        run: python main.py
